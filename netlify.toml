[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/debtleadqualifier/download"
  to = "/.netlify/functions/download"
  status = 200

[[redirects]]
  from = "/debtleadqualifier/success"
  to = "/debtleadqualifier/download"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[functions]
  node_bundler = "esbuild"
